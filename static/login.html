<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · PyCode 練習</title>
<style>
  :root { --bg: #1a1a1a; --panel: #262626; --panel-2: #303030; --border: #3a3a3a;
    --text: #e8e8e8; --muted: #9a9a9a; --accent: #ffa116; --bad: #ef4743; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; color: var(--muted); }
  /* 16px 以上：iPhone 點輸入框時不會自動放大頁面 */
  input { width: 100%; font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { width: 100%; margin-top: 22px; font-size: 16px; padding: 12px; border: none; border-radius: 8px;
    background: var(--accent); color: #1a1a1a; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 12px; }
</style>
</head>
<body>
<form id="form" autocomplete="on">
  <h1>🐍 PyCode <span>練習</span></h1>
  <p class="sub">請用管理員給你的帳號登入</p>
  <label for="username">帳號</label>
  <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="password">密碼</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button id="submit" type="submit">登入</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const form = document.getElementById('form');
form.onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit'), err = document.getElementById('err');
  btn.disabled = true;
  err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: form.username.value, password: form.password.value }),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || '登入失敗'; return; }
    // 只允許跳回本站的頁面
    const next = new URLSearchParams(location.search).get('next') || '/';
    location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/';
  } catch {
    err.textContent = '連不到伺服器，請確認網路或稍後再試';
  } finally {
    btn.disabled = false;
  }
};
document.getElementById('username').focus();
</script>
</body>
</html>
